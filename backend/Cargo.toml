[package]
name = "steam-multiversion-viewer"
version = "0.1.0"
edition = "2024"


[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["tracing", "http1", "json", "macros", "tokio", "query"] }
directories = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
steam-vent = "0.5"
steam-vent-depot = { path = "../../steam-vent-depot" }
steam-vent-proto = "0.5"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
