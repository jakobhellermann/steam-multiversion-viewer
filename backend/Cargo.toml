[package]
name = "steam-multiversion-viewer"
version = "0.1.0"
edition = "2024"


[dependencies]
anyhow = "1.0"
arc-swap = "1.9"
axum = { version = "0.8", default-features = false, features = ["tracing", "http1", "json", "macros", "matched-path", "tokio", "query"] }
camino = { version = "1.2.2", features = ["serde1"] }
directories = "5"
futures-util = "0.3"
mime_guess = "2.0.5"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
similar = "2.6"
thiserror = "2.0"
serde_json = "1"
steam-depot-vfs = { path = "../../steam-depot-vfs/crates/steam-depot-vfs" }
steam-depot-mount = { path = "../../steam-depot-vfs/crates/steam-depot-mount" }
steam-vent = "0.5"
steam-vent-depot = { path = "../../steam-vent-depot" }
steam-vent-proto = "0.5"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
zstd = "0.13.3"
time = { version = "0.3.47", features = ["formatting", "macros"] }
