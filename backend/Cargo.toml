[package]
name = "steam-multiversion-viewer"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/jakobhellermann/steam-multiversion-viewer"

[features]
default = ["unity"]
unity = ["transform/unity", "dep:rabex-env", "dep:rabex-env-steam-depot-vfs"]
# Launch in a native webview window by default
windowed = []
dhat-heap = []

[dependencies]
anyhow = "1.0"
arc-swap = "1.9"
axum = { version = "0.8", default-features = false, features = ["tracing", "http1", "json", "macros", "matched-path", "tokio", "query"] }
bytes = "1"
camino = { version = "1.2", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
dll-diff = { path = "../crates/dll-diff" }
futures-util = "0.3"
mime_guess = "2.0"
open = "5"
parking_lot = "0.12"
rabex-env = { version = "0.1.0", git = "https://github.com/jakobhellermann/rabex-env", optional = true, features = ["tracing-instrument"] }
rabex-env-steam-depot-vfs = { version = "0.1.0", git = "https://github.com/jakobhellermann/rabex-env", optional = true, features = ["tracing-instrument"] }
rust-embed = "8"
serde = { version = "1.0", features = ["derive"] }
serde-value = "0.7"
serde_json = "1"
similar = "3.1"
steam-depot-vfs = { git = "https://github.com/jakobhellermann/steam-depot-vfs" }
steam-vent = "0.5"
steam-vent-depot = { git = "https://github.com/jakobhellermann/steam-vent-depot" }
steam-vent-proto = "0.5"
tao = "0.36"
thiserror = "2.0"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "process", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transform = { path = "../crates/transform", default-features = false }
utoipa = { version = "5", features = ["axum_extras", "preserve_path_order"] }
utoipa-axum = "0.2"
wry = "0.56"
zstd = "0.13.3"

[dev-dependencies]
tracing-timetree = { git = "https://github.com/jakobhellermann/tracing-timetree" }
insta = { version = "1", features = ["yaml"] }
dhat = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
steam-depot-mount = { git = "https://github.com/jakobhellermann/steam-depot-vfs", features = ["fuse"] }

[target.'cfg(target_os = "macos")'.dependencies]
steam-depot-mount = { git = "https://github.com/jakobhellermann/steam-depot-vfs", features = ["nfs"] }
muda = "0.19"

[target.'cfg(target_os = "windows")'.dependencies]
steam-depot-mount = { git = "https://github.com/jakobhellermann/steam-depot-vfs", features = ["projfs"] }
window-vibrancy = "0.8"
softbuffer = "0.4"

[package.metadata.packager]
product-name = "Steam Multiversion Viewer"
identifier = "io.github.jakobhellermann.steam-multiversion-viewer"
icons = ["../frontend/public/logo512.png"]
formats = ["app", "dmg", "wix", "appimage", "deb"]
out-dir = "dist"
before-packaging-command = "cargo build --release --features windowed"

[package.metadata.packager.appimage]
# see https://github.com/tauri-apps/tauri/pull/2940
excluded-libraries = ["libwebkit2gtk-4.1.so*", "libjavascriptcoregtk-4.1.so*"]

[package.metadata.packager.macos]
signing-identity = "-" # ad-hoc signing
