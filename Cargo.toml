members = ["backend", "crates/dll-diff", "crates/transform"]
package.license = "MIT OR Apache-2.0"
package.version = "0.2.0"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
dotnetdll = { git = "https://github.com/jakobhellermann/dotnetdll", branch = "wip" }
