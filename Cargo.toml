[workspace]
resolver = "3"
members = ["backend", "crates/dll-diff", "crates/transform"]

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
dotnetdll = { git = "https://github.com/jakobhellermann/dotnetdll", branch = "wip" }
# `rabex-env-steam-depot-vfs` pulls `rabex-env` via git; our path dep would otherwise duplicate the crate.
# [patch."https://github.com/jakobhellermann/rabex-env"]
# rabex-env = { path = "../../../../unity/rabex-env" }
[patch."https://github.com/jakobhellermann/steam-depot-vfs"]
# steam-depot-vfs = { path = "../steam-depot-vfs/crates/steam-depot-vfs" }
# steam-depot-mount = { path = "../steam-depot-vfs/crates/steam-depot-mount" }
