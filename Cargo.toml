[workspace]
resolver = "3"
members = ["backend", "crates/dll-diff", "crates/transform"]

[profile.dev.package."*"]
opt-level = 2

# `rabex-env-steam-depot-vfs` pulls `rabex-env` via git; our path dep
# would otherwise duplicate the crate. Point the git source at the same
# local checkout so cargo treats them as one.
# [patch."https://github.com/jakobhellermann/rabex-env"]
# rabex-env = { path = "../../../../unity/rabex-env" }

# Local patch of dotnetdll: the upstream `#[tracing::instrument]` attrs
# in `src/convert/{read,write}.rs` capture `ctx: &Context` as a span
# field, which `Debug`-prints the whole metadata-table snapshot on
# every span entry. The patched fork switches them all to `skip_all`.
[patch.crates-io]
dotnetdll = { path = "../../dotnet/dotnetdll" }
