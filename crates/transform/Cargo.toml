[package]
name = "transform"
version = "0.1.0"
edition = "2024"

[features]
default = ["unity"]
# Optional unity-asset support — serializedfile / bundle handling via
# rabex. Disable to drop the rabex dep entirely.
unity = [
  "dep:rabex-env",
  "dep:rabex-texture",
  "dep:playmakerfsm",
  "dep:aes",
  "dep:ecb",
  "dep:base64",
  "dep:lz4_flex",
]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
camino = { version = "1.2.2", features = ["serde1"] }
dll-diff = { path = "../dll-diff" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde-value = "0.7"
similar = "3.1"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "sync"] }
tracing = "0.1"
utoipa = "5"
zstd = "0.13.3"
rabex-env = { version = "0.1.0", git = "https://github.com/jakobhellermann/rabex-env", optional = true, features = [
  "tracing-instrument",
] }
rabex-texture = { version = "0.1.0", git = "https://github.com/jakobhellermann/rabex-env", optional = true }
aes = { version = "0.9", optional = true }
ecb = { version = "0.2", optional = true }
base64 = { version = "0.22", optional = true }
lz4_flex = { version = "0.13", optional = true }
playmakerfsm = { git = "https://github.com/jakobhellermann/playmakerfsm", optional = true }

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
