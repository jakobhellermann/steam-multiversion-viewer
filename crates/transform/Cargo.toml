[package]
name = "transform"
version = "0.1.0"
edition = "2024"

[features]
default = ["unity"]
# Optional unity-asset support — serializedfile / bundle handling via
# rabex. Disable to drop the rabex dep entirely.
unity = ["dep:rabex-env", "dep:rabex-env-steam-depot-vfs"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
camino = { version = "1.2.2", features = ["serde1"] }
dll-diff = { path = "../dll-diff" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde-value = "0.7"
similar = "2.6"
steam-depot-vfs = { git = "https://github.com/jakobhellermann/steam-depot-vfs" }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "sync"] }
tracing = "0.1"
utoipa = "5"
zstd = "0.13.3"
rabex-env = { version = "0.1.0", git = "https://github.com/jakobhellermann/rabex-env", optional = true, features = ["tracing-instrument"] }
rabex-env-steam-depot-vfs = { version = "0.1.0", git = "https://github.com/jakobhellermann/rabex-env", optional = true, features = ["tracing-instrument"] }

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
